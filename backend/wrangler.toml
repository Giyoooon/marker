name = "marker-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
account_id = "41a5668f3ab9fce48ef416ed5e67ba88"

[vars]
# 브라우저에서 이 API를 호출할 수 있는 출처 (쉼표로 구분)
ALLOWED_ORIGINS = "https://giyoooon.github.io,http://localhost:8080,http://127.0.0.1:8080"

# KAKAO_REST_KEY 는 비밀값이라 여기 두지 않음
#   로컬: backend/.dev.vars 에 KAKAO_REST_KEY=...
#   배포: npx wrangler secret put KAKAO_REST_KEY

# 공유 지도 DB (Cloudflare D1). 스키마는 migrations/ — 배포 때 GitHub Actions 가 원격에 적용
#   로컬: npx wrangler d1 migrations apply marker --local
[[d1_databases]]
binding = "DB"
database_name = "marker"
database_id = "8c34536b-e034-4de6-86c8-8894c2e3560a"
migrations_dir = "migrations"

# 지도 방 (Durable Object, src/room.ts): 지도 번호마다 하나. 웹소켓 접속자 목록과 변경 알림
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "MapRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MapRoom"]   # 무료 플랜은 SQLite 방식 Durable Object 만 가능

# 요청 수 제한 (봇·자동화 대비). IP 마다, Cloudflare 위치별로 세는 근사치. period 는 10 또는 60(초)만 가능
# 한도를 바꾸면 src/security.ts 주석도 맞출 것. namespace_id 는 계정 안에서 겹치지 않는 정수
[[ratelimits]]
name = "RL_WS"        # 웹소켓 연결
namespace_id = "1101"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_MISS"      # 없는 지도 코드 조회 (코드 맞히기)
namespace_id = "1102"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_READ"      # 지도 조회
namespace_id = "1103"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_WRITE"     # 마킹·수정·삭제·순서
namespace_id = "1104"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_CREATE"    # 공유 지도 만들기
namespace_id = "1105"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RL_JOIN"      # 닉네임 만들기·들어가기
namespace_id = "1106"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_SEARCH"    # 카카오 장소 검색
namespace_id = "1107"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_ROUTE"     # 경로 구간·최단 정렬 (카카오 길찾기)
namespace_id = "1108"
simple = { limit = 150, period = 60 }
