<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마커 — 우리끼리 여행 경로 짜기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>🗺️ 마커 — 우리끼리 여행 경로 짜기</h1>
      <p>고정 일정을 넣고 가고 싶은 곳을 고르면 시간에 맞춰 동선을 짜 드려요.</p>
    </header>
    <div class="search">
      <form id="searchForm">
        <input id="q" placeholder="장소 검색 (예: 동대구역, 수성못)" autocomplete="off">
        <button class="btn">검색</button>
      </form>
      <div id="results"></div>
    </div>
    <nav class="tabs">
      <button data-tab="setup" class="on">기본 설정</button>
      <button data-tab="fixed">고정 일정<span class="badge" id="nFixed">0</span></button>
      <button data-tab="spots">가볼 곳<span class="badge" id="nSpots">0</span></button>
      <button data-tab="route">내 경로<span class="badge" id="nRoute">0</span></button>
      <button data-tab="plan">결과</button>
    </nav>
    <section class="tab on" id="tab-setup"></section>
    <section class="tab" id="tab-fixed"></section>
    <section class="tab" id="tab-spots"></section>
    <section class="tab" id="tab-route"></section>
    <section class="tab" id="tab-plan"><p class="hint">아래 <b>경로 짜기</b>를 누르면 여기에 일정이 나와요.</p></section>
    <div class="foot">
      <button class="btn primary" id="planBtn" data-act="plan">🧭 경로 짜기</button>
      <button class="btn" data-act="share" title="친구에게 보낼 링크 복사">🔗 공유</button>
    </div>
  </aside>
  <div id="mapWrap">
    <main id="map"></main>
    <div id="mapError"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
