<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>마커-같이 새기자</title>
<!-- 친구끼리 쓰는 지도라 검색엔진·AI 수집 대상이 아님 (공유 링크 ?map= 페이지가 수집되지 않게) -->
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- 사람 확인(human.js) 서버에 미리 연결해서 처음 확인을 빠르게 -->
<link rel="preconnect" href="https://challenges.cloudflare.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <!-- 모바일 바텀시트 손잡이: 누르면 접기·반·펼치기 순서로, 끌어서 높이 조절 (데스크톱에선 숨김) -->
    <button class="sheet-handle" id="sheetHandle" type="button" aria-label="목록 펼치기"><span></span></button>
    <header>
      <div class="brand">
        <h1><span class="logo" aria-hidden="true"></span>마커</h1>
        <button class="btn sm together" data-act="roomStart">같이 새기기</button>
      </div>
      <div id="roomBar"></div>
      <form id="searchForm" role="search">
        <input id="q" type="search" placeholder="어디를 마킹할까요? 예: 수성못" autocomplete="off" aria-label="장소 검색">
        <button class="btn">검색</button>
      </form>
      <div id="results"></div>
    </header>
    <section id="markers" aria-label="마커 목록"></section>
    <footer class="foot">
      <div id="totals" aria-live="polite"></div>
      <div class="foot-actions">
        <select id="mode" aria-label="이동수단">
          <option value="car">🚗 자동차</option>
          <option value="transit">🚌 대중교통</option>
          <option value="walk">🚶 도보</option>
        </select>
        <button class="btn primary" id="optBtn" data-act="optimize" title="출발지는 그대로 두고 나머지를 이동시간이 가장 짧은 순서로 바꿔요">최단 순서로 정렬</button>
        <button class="btn" data-act="share" title="친구에게 보낼 링크 복사">공유</button>
      </div>
    </footer>
  </aside>
  <div id="mapWrap">
    <main id="map"></main>
    <div id="mapError"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg" aria-label="공유 지도"></dialog>

<script src="config.js"></script>
<script src="map.js"></script>
<script src="human.js"></script>
<script src="room.js"></script>
<script src="app.js"></script>
<script src="sheet.js"></script>
</body>
</html>
