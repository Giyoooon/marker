<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마커 — 찍고, 순서 정하고, 경로 보기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>📍 마커</h1>
      <p>장소를 마킹하고 순서를 정하면 그 순서대로 경로를 그려요.</p>
    </header>
    <div class="search">
      <form id="searchForm">
        <input id="q" placeholder="장소 검색 (예: 동대구역, 수성못)" autocomplete="off">
        <button class="btn">검색</button>
      </form>
      <div id="results"></div>
    </div>
    <section id="markers"></section>
    <div class="foot">
      <select id="mode" title="이동수단">
        <option value="car">🚗 자동차</option>
        <option value="transit">🚌 대중교통</option>
        <option value="walk">🚶 도보</option>
      </select>
      <button class="btn primary" id="optBtn" data-act="optimize" title="첫 번째 마커를 출발지로 두고 나머지를 이동시간이 가장 짧은 순서로">✨ 최단 순서로 정렬</button>
      <button class="btn" data-act="share" title="친구에게 보낼 링크 복사">🔗 공유</button>
    </div>
  </aside>
  <div id="mapWrap">
    <main id="map"></main>
    <div id="mapError"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
