name: Deploy backend to Cloudflare Workers

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 저장소 Settings > Secrets and variables > Actions > Secrets 의 CLOUDFLARE_API_TOKEN 사용
      # (KAKAO_REST_KEY 는 Cloudflare 에 저장돼 있어 배포해도 유지됨)
      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN 이 없어요 (Settings > Secrets and variables > Actions > Secrets 탭)"
            exit 1
          fi
      # 새 마이그레이션(backend/migrations)이 있으면 원격 D1 에 먼저 적용 (이미 적용된 건 건너뜀)
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply marker --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
